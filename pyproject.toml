[project]
name = "unzip-bot"
version = "7.4.0"
authors = [
  { name="EDM115", email="unzip@edm115.dev" },
]
description = "A Telegram bot to extract various types of archives"
dependencies = [
  "aiocron==2.1",
  "aiofiles==25.1.0",
  "aiohttp==3.14.5",
  "base58check==1.0.2",
  "dnspython==2.9.1",
  "gitdb==4.0.12",
  "GitPython==3.2.1",
  "motor==3.7.1",
  "mutagen==1.48.1",
  "Pillow==13.0.0",
  "psutil==7.2.2",
  "pykeyboard==0.1.5",
  "pyrofork==2.3.69",
  "PyTgCrypto==1.2.12",
  "requests==2.34.2",
  "setuptools==84.2.1",
  "unzip-http==0.9",
  "wheel==0.48.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
format = "ruff format"
install = "uv sync"
install-pip = "pip install -U -r requirements.txt"
lint = "ruff check"
lint-fix = "ruff check --fix"
run = "./start.sh"
venv = "python -m venv .venv"

[project.urls]
"Homepage" = "https://github.com/EDM115/unzip-bot"
"Bug Tracker" = "https://github.com/EDM115/unzip-bot/issues"
"Funding" = "https://github.com/EDM115#support-me-"

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
logger-objects = ["unzipbot.LOGGER"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.uv]
compile-bytecode = true

[tool.uv.pip]
compile-bytecode = true
generate-hashes = true
